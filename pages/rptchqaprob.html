<div class="container" ng-controller="rptChequesAprobacionCtrl">
    <ul class="nav nav-tabs">
        <li class="active">
            <a show-tab href="#divCheques" data-toggle="tab">Cheques</a>
        </li>
        <li>
            <a show-tab href="#divNotas" data-toggle="tab">Notas de d&eacute;bito</a>
        </li>
    </ul>
    <div class="tab-content">
        <div class="tab-pane fade in active" id="divCheques">
            <div class="row">
                <div class="panel panel-default">
                    <div class="panel-heading">Generaci&oacute;n de archivo de cheques</div>
                    <div class="panel-body">
                        <div class="row">
                            <div class="col-md-2">
                                <div class="form-group">
                                    <label for="txtFecha">Fecha:</label>
                                    <input name="txtFecha" id="txtFecha" type="date" class="form-control"
                                        ng-model="params.fecha" />
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label for="selEmpresa">Empresa:</label>
                                    <select name="selEmpresa" id="selEmpresa" class="form-control"
                                        ng-model="params.idempresa"
                                        ng-options="obj.id as obj.nomempresa for obj in empresas"
                                        ng-change="bancos = []; params.banco = undefined; loadBancos(params.idempresa)">
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group">
                                    <label for="selEmpresa">Banco:</label>
                                    <select name="selBanco" id="selBanco" class="form-control" ng-model="params.banco"
                                        ng-options="obj.id as obj.nombre for obj in bancos">
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-2">
                                <div class="form-group">
                                    <label for="selMoneda">Moneda:</label>
                                    <select name="selMoneda" id="selMoneda" class="form-control"
                                        ng-model="params.idmoneda"
                                        ng-options="obj.id as obj.simbolo for obj in monedas">
                                    </select>
                                </div>
                            </div>
                        </div>
                        <button type="button" class="btn btn-primary" ng-click="getCheques()"
                            ng-disabled="params.fecha == null || params.fecha == undefined">
                            <span class="glyphicon glyphicon-download"></span>
                        </button>
                        <button type="button" class="btn btn-primary" ng-click="resetParams()">
                            <span class="glyphicon glyphicon-refresh"></span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
        <div class="tab-pane fade" id="divNotas">
            <div class="row">
                <div class="panel panel-default">
                    <div class="panel-heading">Generaci&oacute;n de archivo de notas de d&eacute;bito</div>
                    <div class="panel-body">
                        <form name="paramsNota" id="paramsNota" novalidate>
                            <div class="col-md-4">
                                <div class="form-group required">
                                    <label for="txtFecha" class="control-label">Fecha:</label>
                                    <input name="txtFecha" id="txtFecha" type="date" class="form-control"
                                        ng-model="params.fecha" required />
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group required">
                                    <label for="selEmpresa" class="control-label">Empresa:</label>
                                    <select name="selEmpresa" id="selEmpresa" class="form-control"
                                        ng-model="params.idempresa"
                                        ng-options="obj.id as obj.nomempresa for obj in empresas"
                                        ng-change="bancos = []; params.banco = undefined; loadBancos(params.idempresa)"
                                        required>
                                    </select>
                                </div>
                            </div>
                            <div class="col-md-4">
                                <div class="form-group required">
                                    <label for="selEmpresa control-label">Banco:</label>
                                    <select name="selBanco" id="selBanco" class="form-control" ng-model="params.idbanco"
                                        ng-options="obj.id as obj.nombre for obj in bancos" required>
                                    </select>
                                </div>
                            </div>
                        </form>
                    </div>
                    <div class="panel-footer text-right">
                        <div class="btn-group">
                            <button type="button" class="btn btn-primary" ng-click="getNotas(params)"
                                ng-disabled="paramsNota.$invalid" title="Descargar archivo CSV">
                                <i class="fi fi-sr-file-csv"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

</div>
