<style>
    .amarillo {
        background-color: #F7EB89;
        text-align: center;
        border-radius: 5px;
        font-size: 16px;
    }

    .celeste {
        background-color: rgb(217, 231, 248);
        border-radius: 5px;
    }

    .gris {
        background-color: #E8E8E8;
        border-radius: 5px;
    }

    .blanco {
        background-color: white;
    }

    .search-container {
        position: relative;
        display: flex;
        align-items: center;
    }

    .search-container input {
        padding-left: 30px;
        /* Ajusta el padding para que no se superponga el ícono */
    }

    .search-icon {
        position: absolute;
        left: 10px;
        /* Ajusta la posición del ícono */
        color: #aaa;
        /* Color del ícono */
    }
</style>
<div class="container" ng-controller="asuetosCtrl">
    <div class="row">
        <div class="panel panel-default">
            <div class="panel-heading">Vacaciones</div>
            <div class="panel-body">
                <form name="paramsAsuetos" id="paramsAsuetos" novalidate>
                    <div class="row">
                        <div class="col-md-4">
                            <div class="form-group required">
                                <label class="control-label">A&ntilde;o:</label>
                                <input type="number" ng-model="asueto.anio" ng-change="getRegistro(asueto.idempleado)"
                                    class="form-control">
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group required">
                                <label class="control-label">Fecha inicia:</label>
                                <input type="date" class="form-control" ng-model="asueto.fechainicio" required
                                    ng-attr-max="{{asueto.fechafin | date:'yyyy-MM-dd'}}">
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group required">
                                <label class="control-label">Fecha fin:</label>
                                <input type="date" class="form-control" ng-model="asueto.fechafin" required
                                    ng-attr-min="{{asueto.fechainicio | date:'yyyy-MM-dd'}}">
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group required">
                                <label class="control-label">D&iacute;as:</label>
                                <input type="number" ng-model="asueto.dias" class="form-control" ng-disabled="true"
                                    required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group required">
                                <label class="control-label">D&iacute;as totales:</label>
                                <input type="number" ng-model="dias_totales" class="form-control" ng-disabled="true">
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-12">
                            <div class="form-group required">
                                <label class="control-label">Concepto:</label>
                                <textarea rows="2" ng-model="asueto.concepto" class="form-control" title="Ingresar concepto del asueto"
                                    required></textarea>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="panel-footer text-right">
                <div class="row">
                    <div class="col-md-12">
                        <div class="form-group">
                            <div class="btn-group btn-group-justified" role="group">
                                <div class="btn-group" role="group">
                                    <button class="btn btn-primary" title="Guardar asueto" type="button"
                                        ng-disabled="paramsAsuetos.$invalid || cargando || !modificaciones"
                                        ng-click="guardar(asueto)">
                                        <i class="fi fi-rr-disk"></i> Guardar
                                    </button>
                                </div>
                                <div class="btn-group" role="group">
                                    <button class="btn btn-danger" title="Eliminar asueto" type="button"
                                        ng-disabled="cargando || !asueto.id"
                                        ng-click="eliminar(asueto)">
                                        <i class="fi fi-rr-trash"></i> Eliminar
                                    </button>
                                </div>
                                <div class="btn-group" role="group">
                                    <button class="btn btn-default" title="Crear nuevo asueto" type="button"
                                        ng-disabled="cargando || !asueto.id"
                                        ng-click="resetParams(asueto.anio, registro)">
                                        <i class="fi fi-br-plus"></i> Nuevo
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </hr>
    <div class="row" ng-show="cargando">
        <div class="col-md-6 col-md-offset-3">
            <div class="well well-sm" style="text-align: center; font-size: 1.45em; font-weight: bold;">
                <span class="label label-primary">Cargando por favor espere...</span>
                <img ng-src="img/generando.gif" alt="Obteniendo informacion..." style="width: 25px; height: 25px;" />
            </div>
        </div>
    </div>
    <div id="tblResumen">
        <table class="table table-responsive table-hover" ng-show="registro.length > 0 && !cargando">
            <caption class="celeste">
                <h4 style="color: black; text-align: center;">Registro de asuetos del {{asueto.anio}}</h4>
            </caption>
            <thead>
                <tr>
                    <th>A&ntilde;o</th>
                    <th>Fecha Inicio</th>
                    <th>Fecha Fin</th>
                    <th>D&iacute;as</th>
                    <th>Concepto</th>
                </tr>
            </thead>
            <tbody>
                <tr ng-repeat="r in registro" ng-click="getDetalle(r.id)">
                    <td>{{r.anio}}</td>
                    <td>{{r.fechainicio | date:'dd/MM/yyyy'}}</td>
                    <td>{{r.fechafin | date: 'dd/MM/yyyy'}}</td>
                    <td>{{r.dias}}</td>
                    <td>{{r.concepto}}</td>
                </tr>
            </tbody>
        </table>
        <h4 style="color: black; text-align: center;" ng-show="registro.length == 0 && !cargando" class="celeste">No se
            han
            registrado asuetos para el a&ntilde;o {{asueto.anio}}</h4>
    </div>
</div>
