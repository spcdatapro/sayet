<style>
    .amarillo {
        background-color: #F7EB89;
        text-align: center;
        border-radius: 5px;
        font-size: 16px;
    }

    .celeste {
        background-color: rgb(217, 231, 248);
        border-radius: 5px;
    }

    .gris {
        background-color: #E8E8E8;
        border-radius: 5px;
    }

    .blanco {
        background-color: white;
    }

    .search-container {
        position: relative;
        display: flex;
        align-items: center;
    }

    .search-container input {
        padding-left: 30px;
        /* Ajusta el padding para que no se superponga el ícono */
    }

    .search-icon {
        position: absolute;
        left: 10px;
        /* Ajusta la posición del ícono */
        color: #aaa;
        /* Color del ícono */
    }
</style>
<div class="container" ng-controller="horariosCtrl">
    <div class="row">
        <div class="panel panel-default">
            <div class="panel-heading">Horarios</div>
            <div class="panel-body">
                <form name="paramsHorarios" id="paramsHorarios" novalidate>
                    <div class="row">
                        <div class="col-md-12">
                            <div class="form-group required">
                                <label for="nombre" class="control-label">Nombre:</label>
                                <input type="text" id="nombre" name="nombre" class="form-control" autofocus="true"
                                    ng-model="horario.nombre" placeholder="Ingrese algun nombre para identificar el horario" required />
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-4">
                            <div class="form-group required">
                                <label for="horario_del" class="control-label">Horario del:</label>
                                <input type="time" id="horario.del" name="horario_del" class="form-control"
                                    ng-model="horario.del" title="Seleccionar el horario en que comineza" required />
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group required">
                                <label for="horario_al" class="control-label">Horario al:</label>
                                <input type="time" id="horario_al" name="horario_al" class="form-control"
                                    ng-model="horario.al" title="Seleccionar el horario en que finaliza" required />
                            </div>
                        </div>
                        <div class="col-md-4">
                            <div class="form-group required">
                                <label for="dias_semana" class="control-label">D&iacute;as de la semana:</label>
                                <ui-select ng-model="horario.dias_semana" title="Seleccione los días de la semana..."
                                    theme="bootstrap" autofocus="false" class="form-control" multiple required>
                                    <ui-select-match placeholder="Seleccionar días" allow-clear="true">
                                        <span>{{$item.nombre}}</span>
                                    </ui-select-match>
                                    <ui-select-choices repeat="item.id as item in dias_semana | filter:$select.search">
                                        <div ng-bind-html="item.nombre | highlight: $select.search">
                                        </div>
                                    </ui-select-choices>
                                    <ui-select-no-choice>No hay resultados...</ui-select-no-choice>
                                </ui-select>
                            </div>
                        </div>
                    </div>
                    <div class="row">
                        <div class="col-md-12">
                            <div class="form-group">
                                <label class="control-label">Observaciones:</label>
                                <textarea rows="4" ng-model="horario.observaciones" class="form-control"
                                    placeholder="Opcional, ingrese alguna observacion"></textarea>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="panel-footer text-right">
                <div class="row">
                    <div class="col-md-12">
                        <div class="form-group">
                            <div class="btn-group btn-group-justified" role="group">
                                <div class="btn-group" role="group">
                                    <button class="btn btn-primary" title="Guardar registro" type="button"
                                        ng-disabled="paramsHorarios.$invalid || cargando"
                                        ng-click="guardar(horario)">
                                        <i class="fi fi-rr-disk"></i> Guardar
                                    </button>
                                </div>
                                <div class="btn-group" role="group">
                                    <button class="btn btn-danger" ng-disabled="!horario.id || cargando"
                                        title="Eliminar registro" type="button" ng-click="eliminar(horario.id)">
                                        <i class="fi fi-rr-trash"></i> Eliminar
                                    </button>
                                </div>
                                <div class="btn-group" role="group">
                                    <button class="btn btn-default" title="Crear nuevo registro" type="button"
                                        ng-show="horario.id > 0" ng-disabled="cargando"
                                        ng-click="resetParams()">
                                        <i class="fi fi-br-plus"></i> Nuevo
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </hr>
    <div class="row" ng-show="cargando">
        <div class="col-md-6 col-md-offset-3">
            <div class="well well-sm" style="text-align: center; font-size: 1.45em; font-weight: bold;">
                <span class="label label-primary">Cargando por favor espere...</span>
                <img ng-src="img/generando.gif" alt="Obteniendo informacion..." style="width: 25px; height: 25px;" />
            </div>
        </div>
    </div>
    <div id="tblResumen">
        <table class="table table-responsive table-hover" ng-show="horarios.length > 0 && !cargando">
            <caption class="celeste">
                <h4 style="color: black; text-align: center;">Horarios registrados</h4>
    </div>
    </caption>
    <thead>
        <tr>
            <th>Nombre</th>
            <th>Del</th>
            <th>Al</th>
            <th>D&iacute;as</th>
        </tr>
    </thead>
    <tbody>
        <tr ng-repeat="h in horarios" ng-click="getDetalle(h)">
            <td>{{h.nombre}}</td>
            <td>{{h.delstr}}</td>
            <td>{{h.alstr}}</td>
            <td>{{h.dias}}</td>
        </tr>
    </tbody>
    </table>
    <h4 style="color: black; text-align: center;" ng-show="horarios.length == 0 && !cargando"
        class="celeste">SIN REGISTROS</h4>
</div>
</div>
