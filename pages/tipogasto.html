<div class="container" ng-controller="tipogastoCtrl">
    <ul class="nav nav-tabs">
        <li class="active">
            <a show-tab href="#divFrmTipoGasto" data-toggle="tab">TIPO DE GASTO</a>
        </li>
        <li ng-show="+elTipogasto.id > 0">
            <a show-tab href="#divFrmSubTipoGasto" data-toggle="tab">SUB-TIPO DE GASTO</a>
        </li>
    </ul>
    <div class="tab-content">
        <div id="divFrmTipoGasto" class="tab-pane fade in active">
            <div class="panel panel-info">
                <div class="panel-heading">Tipo de gasto</div>
                <div class="panel-body">
                    <form name="frmTipogasto" id="frmTipogasto"
                        ng-submit="frmTipogasto.$valid && addTipogasto(elTipogasto)" novalidate>
                        <div class="row">
                            <div class="col-md-12">
                                <div class="form-group">
                                    <label for="txtDesctipogast">Descripci&oacute;n:</label>
                                    <input type="text" name="txtDesctipogast" id="txtDesctipogast" class="form-control"
                                        ng-model="elTipogasto.desctipogast"
                                        placeholder="Descripci&oacute;n del tipo de gasto" maxlength="150" required
                                        ng-disabled="sl.tipogasto" />
                                </div>
                            </div>
                        </div>
                        <form-buttons vis="grpBtnTipoGasto" btn-dis="frmTipogasto.$invalid" obj="elTipogasto"
                            uf="updTipogasto(elTipogasto)" df="delTipogasto(elTipogasto)" nf="nuevoTipogasto()"
                            cf="cancelEditTipogasto()" ef="startEditTipogasto()" pf="imprimirTipogasto()"
                            usr="verPermisos(elTipogasto)">
                        </form-buttons>
                    </form>
                    <hr />
                    <table class="table table-responsive table-hover">
                        <thead>
                            <tr>
                                <th>Descripci&oacute;n del Gasto</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr ng-repeat="e in lstTipogastos" ng-click="getTipogasto(e.id)">
                                <td>{{e.desctipogast}}</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
        <div id="divFrmSubTipoGasto" class="tab-pane fade">
            <div class="panel panel-info">
                <div class="panel-heading">Sub-tipo de gasto</div>
                <div class="panel-body">
                    <form name="frmSubTipogasto" id="frmSubTipogasto"
                        ng-submit="frmSubTipogasto.$valid && addSubTipogasto(subtiposgasto)" novalidate>
                        <div class="row">
                            <div class="col-md-12">
                                <div class="form-group">
                                    <label for="txtDescSubtipogast">Descripci&oacute;n:</label>
                                    <input type="text" name="txtDescSubtipogast" id="txtDescSubtipogast"
                                        class="form-control" ng-model="subtiposgasto.descripcion"
                                        placeholder="Descripci&oacute;n del sub-tipo de gasto" maxlength="150" required
                                        ng-disabled="sl.subtipogasto" />
                                </div>
                            </div>
                        </div>
                        <form-buttons vis="grpBtnSubTipoGasto" btn-dis="frmSubTipogasto.$invalid" obj="subtiposgasto"
                            uf="updSubTipogasto(subtiposgasto)" df="delSubTipogasto(subtiposgasto)"
                            nf="nuevoSubTipogasto()" cf="cancelEditSubTipogasto()" ef="startEditSubTipogasto()"
                            pf="imprimirSubTipogasto()">
                        </form-buttons>
                    </form>
                    <hr />
                    <table class="table table-responsive table-hover">
                        <thead>
                            <tr>
                                <th>Descripci&oacute;n del Gasto</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr ng-repeat="s in lstsubtiposgasto" ng-click="getSubTipogasto(s.id)">
                                <td>{{s.descripcion}}</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <!-- modal de usuarios -->
    <script type="text/ng-template" id="modalUsuarioGast.html">
        <div class="modal-header">
            <h3 class="modal-title">{{gasto.desctipogast}}</h3>
            <h4>Asignar usuario</h4>
        </div>
        <div class="modal-body">
            <form name="frmUsr" id="frmUsr" ng-submit="frmUsr.$valid && asignarUsuario(idusuario, gasto.id)" novalidate>
                <div class="row">
                    <div class="col-md-12">
                        <div class="form-group required">
                            <label for="selUsuario">Usuario:</label>
                            <div class="input-group">
                                <ui-select title="Seleccione un usuario..." theme="bootstrap"
                                    autofocus="false" ng-model="idusuario" required ng-change="setUsuario(idusuario)">
                                    <ui-select-match placeholder="Buscar usuario..." allow-clear="true">
                                        <span ng-bind="($select.selected.nombre)"></span>
                                    </ui-select-match>
                                    <ui-select-choices repeat="item.id as item in usuarios | filter:$select.search">
                                        <div ng-bind-html="(item.nombre) | highlight: $select.search"></div>
                                    </ui-select-choices>
                                    <ui-select-no-choice>No hay resultados...</ui-select-no-choice>
                                </ui-select>
                                <div class="input-group-btn">
                                    <button type="submit" class="btn btn-info" ng-disabled="frmUsr.$invalid">
                                        <span class="glyphicon glyphicon-floppy-save"></span>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </form>
            <hr />
            <table class="table table-condensed table-hover">
                <thead>
                    <tr>
                        <th>Usuario</th>
                        <th>&nbsp;</th>
                    </tr>
                </thead>
                <tbody>
                    <tr ng-repeat="usr in asignados">
                        <td>{{usr.nombre}}</td>
                        <td>
                            <button type="button" class="btn btn-danger btn-sm" ng-click="quitarUsuario(usr.id)">
                                <span class="glyphicon glyphicon-trash"></span>
                            </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="modal-footer">
            <!--<button class="btn btn-info" type="button" ng-click="ok()">Aceptar</button>-->
            <button class="btn btn-info" type="button" ng-click="cancel()">Terminar</button>
        </div>
    </script>
</div>
