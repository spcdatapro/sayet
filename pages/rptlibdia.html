<div class="container" ng-controller="rptLibroDiarioCtrl">
    <div class="row">
        <div class="panel panel-default">
            <div class="panel-heading">Libro de diario</div>
            <div class="panel-body" style="text-align: right">
                <div class="row" style="text-align: left">
                    <div class="col-md-3 col-sm-3">
                        <div class="form-group">
                            <label for="txtDel">Del:</label>
                            <input name="txtDel" id="txtDel" type="date" class="form-control" ng-model="params.del"
                                placeholder="Del" ng-change="libromayor = []" />
                        </div>
                    </div>
                    <div class="col-md-3 col-sm-3">
                        <div class="form-group">
                            <label for="txtAl">Al:</label>
                            <input name="txtAl" id="txtAl" type="date" class="form-control" ng-model="params.al"
                                placeholder="Al" ng-change="libromayor = []" />
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="form-group">
                            <label for="chkCierre">Ver partidas de cierre y apertura:</label>
                            <input name="chkCierre" id="chkCierre" type="checkbox" class="form-control"
                                ng-model="params.vercierre" ng-true-value="1" ng-false-value="0" />
                        </div>
                    </div>
                </div>
                <button type="button" class="btn btn-danger" ng-click="getLibroDiario()">
                    <i class="fa fa-file-pdf-o" aria-hidden="true" title="Generar PDF"></i>
                </button>
                <button type="button" class="btn btn-success" ng-click="getLibroDiarioXLSX2()">
                    <i class="fa fa-file-excel-o" aria-hidden="true" title="Generar Excel"></i>
                </button>
            </div>
        </div>
    </div>
    <rpt-viewer contenido="content"></rpt-viewer>
    </hr>
    <div class="row" ng-show="cargando">
        <div class="col-md-6 col-md-offset-3">
            <div class="well well-sm" style="text-align: center; font-size: 1.45em; font-weight: bold;">
                <span class="label label-primary">Generando reporte, por favor espere...</span>
                <img ng-src="img/generando.gif" alt="Generando reporte..." style="width: 25px; height: 25px;" />
            </div>
        </div>
    </div>
</div>
