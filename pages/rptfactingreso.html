<style>
    .amarillo {
        background-color: lightgoldenrodyellow;
        text-align: center;
        border-radius: 5px;
        font-size: 16px;
    }

    .celeste {
        background-color: rgb(217, 231, 248);
        border-radius: 5px;
    }

    .gris {
        background-color: #E8E8E8;
        border-radius: 5px;
    }

    .blanco {
        background-color: white;
    }

    .redondeado {
        border-radius: 10px;
        border: 1px solid #ccc;
        padding: 10px;
    }

    .modal-xl .modal-dialog {
        width: 90%;
        /* o 1200px, lo que necesites */
        max-width: none;
    }
</style>
<div class="container" ng-controller="rptFactIngresoCtrl">
    <div class="row">
        <div class="panel panel-default">
            <div class="panel-heading">Reporte de facturación e ingresos</div>
            <div class="panel-body">
                <form name="paramsRep" id="paramsRep" novalidate>
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label class="control-label">Empresa:</label>
                                <ui-select ng-model="params.idempresa" title="Seleccione una empresa..."
                                    theme="bootstrap" autofocus="false">
                                    <ui-select-match placeholder="Buscar empresa..." allow-clear="true">
                                        <span ng-bind="($select.selected.nomempresa)"></span>
                                    </ui-select-match>
                                    <ui-select-choices repeat="item.id as item in empresas | filter:$select.search">
                                        <div ng-bind-html="(item.nomempresa) | highlight: $select.search"></div>
                                    </ui-select-choices>
                                    <ui-select-no-choice>No hay resultados...</ui-select-no-choice>
                                </ui-select>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group required">
                                <label for="numAnio" class="control-label">A&ntilde;o del:</label>
                                <input name="numAnio" id="numAnio" type="number" class="form-control"
                                    ng-model="params.anio" required>
                            </div>
                        </div>
                    </div>
                </form>
            </div>
            <div class="panel-footer text-right">
                <div class="btn-group btn-group">
                    <div class="btn-group">
                        <button type="button" class="btn btn-danger" ng-click="getPDF(params)"
                            ng-disabled="paramsRep.$invalid || cargando" title="Reporte PDF">
                            <span class="fa fa-file-pdf-o" aria-hidden="true"></span> PDF
                        </button>
                    </div>
                    <div class="btn-group" role="group">
                        <button type="button" class="btn btn-success" ng-click="getXML(params)"
                            ng-disabled="paramsRep.$invalid || cargando" title="Reporte Excel">
                            <span class="fa fa-file-excel-o" aria-hidden="true"></span> Excel
                        </button>
                    </div>
                    <!-- <div class="btn-group" role="group">
                        <button type="button" class="btn btn-primary" ng-click="getResumen(params)"
                            ng-disabled="paramsRep.$invalid || cargando" title="Reporte en pantalla">
                            <i class="fi fi-tr-file-download"></i> En pantalla
                        </button>
                    </div> -->
                </div>
            </div>
        </div>
    </div>
    </hr>
    <div class="row" ng-show="cargando">
        <div class="col-md-6 col-md-offset-3">
            <div class="well well-sm" style="text-align: center; font-size: 1.45em; font-weight: bold;">
                <span class="label label-primary">Generando reporte, por favor espere...</span>
                <img ng-src="img/generando.gif" alt="Generando reporte..." style="width: 25px; height: 25px;" />
            </div>
        </div>
    </div>
    <rpt-viewer contenido="content"></rpt-viewer>
</div>
